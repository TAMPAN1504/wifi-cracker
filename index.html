<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WiFi Password Cracker</title>
  <style>
    body {
      background: #1e1e2f;
      color: #f0f0f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #2a2a3b;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #00d1b2;
    }
    em {
      color: #aaa;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      margin: 1rem 0;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      background: #3a3a4f;
      color: #fff;
    }
    button {
      background-color: #00d1b2;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #00b49c;
    }
    .output {
      margin-top: 1rem;
      font-weight: bold;
      font-size: 1.2rem;
      color: #00ffae;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>WiFi Password Cracker<br><em>By Phasyah</em></h2>
    <input type="text" id="inputString" placeholder="Input SSID disini tanpa menggunakan fh_" />
    <button onclick="generatePassword()">Generate</button>
    <div class="output" id="outputPassword"></div>
    <h3><em>*Notes SSID harus berawalan fh</em></h3><br>
  </div>

  <script>
    const transformasi = {
      '0': 'f', '1': 'e', '2': 'd', '3': 'c', '4': 'b', '5': 'a', '6': '9', '7': '8',
      '8': '7', '9': '6', 'a': '5', 'b': '4', 'c': '3', 'd': '2', 'e': '1', 'f': '0',
      'j': 'b', 'z': '5'
    };

    function generatePassword() {
      const input = document.getElementById('inputString').value.toLowerCase();
      let password = '';
      for (let char of input) {
        password += transformasi[char] || char;
      }
      document.getElementById('outputPassword').textContent = "wlan" + password;
    }
  </script>
</body>
</html>
